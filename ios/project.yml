name: BetterCallSaul
options:
  bundleIdPrefix: kz.techvision
  deploymentTarget:
    iOS: "17.0"
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "6.0"
targets:
  BetterCallSaul:
    type: application
    platform: iOS
    configFiles:
      Debug: Config/Secrets.xcconfig
      Release: Config/Secrets.xcconfig
    sources:
      - path: BetterCallSaul
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: kz.techvision.bettercallsaul
        GENERATE_INFOPLIST_FILE: true
        INFOPLIST_KEY_CFBundleDisplayName: BetterCallSaul
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: true
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: true
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        INFOPLIST_KEY_GeminiAPIKey: $(GEMINI_API_KEY)
        INFOPLIST_KEY_GeminiModel: $(GEMINI_MODEL)
        INFOPLIST_KEY_DeepSeekAPIKey: $(DEEPSEEK_API_KEY)
        INFOPLIST_KEY_DeepSeekModel: $(DEEPSEEK_MODEL)
        TARGETED_DEVICE_FAMILY: "1"
    scheme:
      testTargets:
        - BetterCallSaulTests
        - BetterCallSaulUITests
  BetterCallSaulTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: BetterCallSaulTests
    dependencies:
      - target: BetterCallSaul
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
  BetterCallSaulUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: BetterCallSaulUITests
    dependencies:
      - target: BetterCallSaul
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
